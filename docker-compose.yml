services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane
      POSTGRES_DB: controlplane
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - controlplane-postgres-v2:/var/lib/postgresql/data
      - ./modules/syncore/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./modules/syncore/migrations/002_lease_operations.sql:/docker-entrypoint-initdb.d/002_lease_operations.sql:ro
      - ./modules/syncore/migrations/003_query_bounds.sql:/docker-entrypoint-initdb.d/003_query_bounds.sql:ro

volumes:
  controlplane-postgres-v2:
