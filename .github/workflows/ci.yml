name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syncore
          POSTGRES_PASSWORD: syncore_ci_only
          POSTGRES_DB: syncore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncore -d syncore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SYNCORE_TEST_DATABASE_URL: postgresql://syncore:syncore_ci_only@localhost:5432/syncore_test
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
